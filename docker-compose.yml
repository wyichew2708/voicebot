# Tiq renewal voicebot — GPU deployment.
#
#   docker compose up -d            everything
#   docker compose up -d console    console only, against services already running
#
# The LLM is deliberately absent: Qwen3.6 already runs on this box and voice
# should point at a dedicated replica or a priority-scheduled queue. A batch
# job landing mid-call is dead air to the customer. Set LLM_URL to reach it.
#
# Podman: `podman compose up -d` works, or `podman-compose`. Swap the
# deploy.resources GPU block for `devices: ["nvidia.com/gpu=all"]` if your
# podman uses CDI rather than the nvidia runtime.

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  asr:
    # MERaLiON is the only model here trained on Singlish, and vLLM is where it
    # is fast — ~600 ms against the ~7 s it managed on Apple Silicon.
    image: vllm/vllm-openai:latest
    container_name: voicebot-asr
    <<: *gpu
    command: >
      --model MERaLiON/MERaLiON-3-3B-ASR
      --port 8801
      --max-model-len 8192
      --gpu-memory-utilization 0.22
      --trust-remote-code
    volumes:
      # :z so SELinux lets the container read the shared model cache.
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface:z
    ports: ["127.0.0.1:8801:8801"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8801/v1/models || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 300s      # first run downloads and loads ~6 GB
      retries: 3

  tts:
    # One image per engine (they do not share dependencies). TTS_ENGINE picks
    # which model this box serves improvised lines with; the default is the
    # checkpoint the cache was rendered with. To try another:
    #   TTS_ENGINE=cosyvoice3 docker compose up -d --build tts
    # See docs/tts-models.md for the candidates and their licences.
    build:
      context: .
      dockerfile: Dockerfile.tts
      args:
        TTS_ENGINE: ${TTS_ENGINE:-chatterbox}
    image: voicebot-tts:${TTS_ENGINE:-chatterbox}
    container_name: voicebot-tts
    <<: *gpu
    environment:
      TTS_ENGINE: ${TTS_ENGINE:-chatterbox}
    volumes:
      - ./voices:/app/voices:z
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface:z
    ports: ["127.0.0.1:8802:8802"]
    restart: unless-stopped

  console:
    build:
      context: .
      dockerfile: Dockerfile
    image: voicebot-console:latest
    container_name: voicebot-console
    environment:
      VOICEBOT_PROFILE: rhel
      VOICEBOT_ASR_URL: http://asr:8801
      VOICEBOT_TTS_URL: http://tts:8802
      # Point at the Qwen3.6 replica reserved for voice. host.docker.internal
      # works on Docker Desktop; on Linux use the host IP or an external name.
      VOICEBOT_LLM_URL: ${LLM_URL:-http://host.docker.internal:8000}
      # Where the console's "TTS model" switch finds each trial engine. The
      # services below exist only under `--profile trial`; a name that is
      # not running fails to resolve at once and is listed as not runnable.
      VOICEBOT_TTS_SIDECARS: ${VOICEBOT_TTS_SIDECARS:-cosyvoice3=http://tts-cosyvoice3:8802,kokoro=http://tts-kokoro:8802,vibevoice=http://tts-vibevoice:8802,chatterbox-turbo=http://tts-chatterbox-turbo:8802,indextts2=http://tts-indextts2:8802,f5=http://tts-f5:8802}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # The pre-rendered cache is data, not code: mounted so it can be
      # regenerated without rebuilding, and shared with the TTS sidecar.
      - ./voices:/app/voices:z
      # The listening gallery's shipped recordings. Read-only: what this
      # machine renders goes under voices/bench/say, in the mount above.
      - ./samples:/app/samples:ro,z
    ports: ["8788:8788"]
    depends_on:
      asr:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------- trials
  # One sidecar per candidate engine, for the console's "TTS model" switch
  # (config/tts-models.yaml). Built and started only on request:
  #
  #     docker compose --profile trial up -d --build tts-cosyvoice3 tts-kokoro
  #
  # Each is its own image (the engines do not share dependencies) on its own
  # port, beside the default sidecar rather than in its place — the cache was
  # rendered by Chatterbox, and a trial engine on 8802 would put a different
  # speaker on every improvised line of every call.

  tts-cosyvoice3:
    build: {context: ., dockerfile: Dockerfile.tts, args: {TTS_ENGINE: cosyvoice3}}
    image: voicebot-tts:cosyvoice3
    container_name: voicebot-tts-cosyvoice3
    profiles: ["trial"]
    <<: *gpu
    environment: {TTS_ENGINE: cosyvoice3}
    volumes:
      - ./voices:/app/voices:z
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface:z
    ports: ["127.0.0.1:8803:8802"]

  tts-kokoro:
    build: {context: ., dockerfile: Dockerfile.tts, args: {TTS_ENGINE: kokoro}}
    image: voicebot-tts:kokoro
    container_name: voicebot-tts-kokoro
    profiles: ["trial"]
    <<: *gpu
    environment: {TTS_ENGINE: kokoro}
    volumes:
      - ./voices:/app/voices:z
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface:z
    ports: ["127.0.0.1:8804:8802"]

  tts-vibevoice:
    build: {context: ., dockerfile: Dockerfile.tts, args: {TTS_ENGINE: vibevoice}}
    image: voicebot-tts:vibevoice
    container_name: voicebot-tts-vibevoice
    profiles: ["trial"]
    <<: *gpu
    environment: {TTS_ENGINE: vibevoice}
    volumes:
      - ./voices:/app/voices:z
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface:z
    ports: ["127.0.0.1:8805:8802"]

  tts-chatterbox-turbo:
    build: {context: ., dockerfile: Dockerfile.tts, args: {TTS_ENGINE: chatterbox-turbo}}
    image: voicebot-tts:chatterbox-turbo
    container_name: voicebot-tts-chatterbox-turbo
    profiles: ["trial"]
    <<: *gpu
    environment: {TTS_ENGINE: chatterbox-turbo}
    volumes:
      - ./voices:/app/voices:z
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface:z
    ports: ["127.0.0.1:8806:8802"]

  tts-indextts2:
    build: {context: ., dockerfile: Dockerfile.tts, args: {TTS_ENGINE: indextts2}}
    image: voicebot-tts:indextts2
    container_name: voicebot-tts-indextts2
    profiles: ["trial"]
    <<: *gpu
    environment: {TTS_ENGINE: indextts2}
    volumes:
      - ./voices:/app/voices:z
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface:z
    ports: ["127.0.0.1:8807:8802"]

  tts-f5:
    build: {context: ., dockerfile: Dockerfile.tts, args: {TTS_ENGINE: f5}}
    image: voicebot-tts:f5
    container_name: voicebot-tts-f5
    profiles: ["trial"]
    <<: *gpu
    environment: {TTS_ENGINE: f5}
    volumes:
      - ./voices:/app/voices:z
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface:z
    ports: ["127.0.0.1:8808:8802"]
