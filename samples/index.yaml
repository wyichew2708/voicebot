# What each recording in this directory is, so the console can offer them
# as a listening gallery. Every file here was rendered during earlier voice
# work on this repo; the catalogue is the memory of which model and which
# speaker made it. A wav without an entry is still served, under its filename,
# with the gender guessed from the name.
#
#   gender: female | male | unknown      model: what rendered it
#   lang:   en | zh | nan (Hokkien)      note:  free text
samples:
  # --- the shipped voices, as a call hears them ------------------------------
  final_female_greeting.wav:  {gender: female, model: Chatterbox multilingual, lang: en, label: "Female — turn 1 (shipped voice)"}
  final_male_greeting.wav:    {gender: male,   model: Chatterbox multilingual, lang: en, label: "Male — turn 1 (shipped voice)"}
  console_greeting_male_warm.wav: {gender: male, model: Chatterbox multilingual, lang: en, label: "Male, warm — console greeting"}
  cb_female_greet.wav:        {gender: female, model: Chatterbox multilingual, lang: en, label: "Female (vivian clip) — greeting"}
  cb_female_premium.wav:      {gender: female, model: Chatterbox multilingual, lang: en, label: "Female (vivian clip) — premium turn"}
  cb_male_greet.wav:          {gender: male,   model: Chatterbox multilingual, lang: en, label: "Male (aiden clip) — greeting"}
  cb_male_premium.wav:        {gender: male,   model: Chatterbox multilingual, lang: en, label: "Male (aiden clip) — premium turn"}
  chatterbox_female_vivian.wav: {gender: female, model: Chatterbox multilingual, lang: en, label: "Female — cloned from vivian"}
  chatterbox_male_aiden.wav:  {gender: male,   model: Chatterbox multilingual, lang: en, label: "Male — cloned from aiden"}

