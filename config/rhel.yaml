# RHEL GPU server. Nothing loads in-process: each capability is an HTTP
# service, which is how vLLM is meant to run and how the reserved Qwen3.6
# already runs. Bring the services up with `make rhel-up`.
profile: cuda
register: standard
backend:
  asr:
    # MERaLiON is the real Singlish model and belongs here rather than on the
    # Mac, where it managed 7 s an utterance. On vLLM it reports ~600 ms.
    base_url: http://127.0.0.1:8801
    model: MERaLiON/MERaLiON-3-3B-ASR
  llm:
    # The instance you already run. Voice needs its own replica or priority
    # scheduling — a batch job landing mid-call is dead air to the customer.
    base_url: http://127.0.0.1:8000
    model: Qwen/Qwen3.6-35B-A3B
    max_tokens: 220
    temperature: 0.3
  tts:
    # Improvised lines only. Scripted turns come from the cache below and
    # never reach this service.
    #
    # The sidecar loads the *multilingual* checkpoint and is sent a language
    # with every request. The English-only class is not a substitute: it
    # loads happily, ignores the language and reads Mandarin through the
    # English phonemiser, which produces a file of plausible length that no
    # part of the pipeline flags.
    base_url: http://127.0.0.1:8802
    model: chatterbox-multilingual-v3
    prerender:
      # Identical to the Mac profile on purpose: cache keys are
      # platform-independent, so `make prerender` on a laptop produces wavs
      # this server reuses byte-for-byte. Ship voices/cache with the deploy.
      model: mlx-community/chatterbox-multilingual-v3
      cache_dir: voices/cache
      default_voice: male
      params:
        temperature: 0.5
      voices:
        # Same figures as the Mac profile, deliberately: the cache is keyed on
        # them, so a mismatch would make every line rendered on one machine
        # miss on the other.
        # Each voice clones two clips: an English speaker for English calls and
        # a Mandarin speaker for Mandarin calls. Cloned from the English clip,
        # a Mandarin line came back from the recogniser with every character
        # right and none of the punctuation — the tones and phrasing were flat,
        # because the speaker being imitated had never spoken Mandarin. The
        # Mandarin clips are Kokoro's own zm_yunjian (every male voice) and
        # zf_xiaobei (every female voice), read a Mandarin paragraph. The
        # language of the *line* picks the clip, so an address inside a
        # Mandarin sentence is read by the Mandarin speaker rather than by a
        # second voice at the seam. target_f0 for those clips is measured the
        # same way as the rest, over five scripted lines: 135 Hz and 226 Hz.
        # English keys are untouched by any of this; only Mandarin re-renders.
        male:
          label: "Male"
          note: "US · original"
          ref_audio: {en: voices/refs/male.wav, zh: voices/refs/zm_yunjian.wav}
          target_f0: {en: 162, zh: 135}
        female:
          label: "Female"
          note: "US · original"
          ref_audio: {en: voices/refs/female.wav, zh: voices/refs/zf_xiaobei.wav}
          # Cloning copies the reference speaker's delivery, and this one
          # reads slowly: 156 words a minute against the male voice's 202.
          # Neither cfg_weight nor exaggeration moves it and Chatterbox
          # ignores `speed`, so it is corrected with the same
          # pitch-preserving stretch the "speak slower" path uses.
          #
          # 1.25 measured ~190-200 wpm and was too fast on the line; 1.10
          # lands around 170, between the two voices. Below 1.0 slows a voice
          # down. It is in the cache key, so changing it re-renders that
          # voice — pick a number rather than sweeping.
          rate: {en: 1.1, zh: 1.0}
          target_f0: {en: 233, zh: 226}
        # Three more, generated from Kokoro's *named speaker* embeddings
        # rather than cloned, then used as Chatterbox references. Kokoro holds
        # a speaker by construction, so the clip itself is as steady as this
        # stack gets — and each is 20-23 s against the original female clip's
        # 7.6 s, which is the other half of why that one wandered.
        #
        # Pitch spread across the reference's own voiced frames, lower being
        # steadier: female 9.7 semitones, isabella 6.4, bella 7.2, sarah 9.6.
        # Sarah is no steadier than the voice it is offered beside; it is here
        # because it was asked for, and the measurement is recorded so the
        # choice is an informed one.
        #
        # target_f0 is measured from what the *clone* lands on over five
        # scripted lines, not from the reference clip: setting it from the
        # clip would drag every line toward a figure the clone never produces.
        isabella:
          label: "Isabella"
          note: "UK · steady"
          ref_audio: {en: voices/refs/bf_isabella.wav, zh: voices/refs/zf_xiaobei.wav}
          target_f0: {en: 200, zh: 226}
        bella:
          label: "Bella"
          note: "US · warm"
          ref_audio: {en: voices/refs/af_bella.wav, zh: voices/refs/zf_xiaobei.wav}
          target_f0: {en: 209, zh: 226}
        sarah:
          label: "Sarah"
          note: "US · brighter"
          ref_audio: {en: voices/refs/af_sarah.wav, zh: voices/refs/zf_xiaobei.wav}
          target_f0: {en: 178, zh: 226}

        michael:
          label: "Michael"
          note: "US · deeper"
          ref_audio: {en: voices/refs/am_michael.wav, zh: voices/refs/zm_yunjian.wav}
          target_f0: {en: 125, zh: 135}

        eric:
          label: "Eric"
          # 161 Hz against the original Male voice's 162 — the nearest match
          # in the set, for keeping that character while gaining a reference
          # clip nearly three times as long. Reads at 140 wpm against Male's
          # 168; add `rate:` here if that is too deliberate on the line.
          note: "US · like Male"
          ref_audio: {en: voices/refs/am_eric.wav, zh: voices/refs/zm_yunjian.wav}
          target_f0: {en: 161, zh: 135}

languages: [en, zh]
audio:
  sample_rate: 16000

# Same guardrail as the Mac profile: the model chooses a handler for replies
# the keyword handlers do not recognise, and never writes a word the caller
# hears. See docs/guardrail.md.
#
# Left implicit it would have defaulted to a 1500 ms timeout here — tighter
# than the Mac's 2500 ms, on a box where the LLM is shared with whatever else
# runs on it. Explicit, and matching, so the two deployments behave the same.
guardrail:
  enabled: true
  timeout_ms: 2500

# --- knowledge bundle ------------------------------------------------------
# See knowledge/okf.yaml and docs/knowledge-layer.md.
#
# This box is the production path, so unsourced wording is refused. Every
# coverage question about home insurance therefore becomes a callback from a
# colleague, because the product has no policy wording in the corpus yet
# (knowledge/conflicts/0001-no-sg-home-wording.md).
#
# That is the intended behaviour, not a regression. Ingest the wording, move
# the pages to approved, and the same deployment starts answering them with a
# citation -- no code change and no config change.
knowledge:
  jurisdiction: SG
  products:
    - product/general/home
    - product/protection/personal-accident
  unsourced_answers: refuse
